version: '3.8'

services:
  # 1. Işık Hızında Önbellek Servisimiz
  portfoy-redis:
    image: redis:latest
    container_name: portfoy-redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 2. Yerel Yapay Zeka Servisimiz
  portfoy-ollama:
    image: ollama/ollama:latest
    container_name: portfoy-ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama # İndirilen Llama3 modeli PC kapanınca silinmesin diye
    restart: unless-stopped


    # 3. YENİ: Vektör Veritabanımız (Semantic Search için)
  portfoy-qdrant:
    image: qdrant/qdrant:latest
    container_name: portfoy-qdrant-server
    ports:
      - "6333:6333" # API ve Arayüz Portu
    volumes:
      - qdrant_data:/qdrant/storage # Vektörlerimiz silinmesin diye
    restart: unless-stopped
volumes:
  ollama_data:
  qdrant_data: