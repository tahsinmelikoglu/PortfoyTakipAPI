<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş & Kayıt - Portföy Yönetim Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="card shadow border-0 rounded-lg mt-5">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h3 class="font-weight-light my-2" id="formBaslik">Portföy Yönetim Sistemi</h3>
                    </div>
                    <div class="card-body p-4">

                        <!-- Ortak Hata/Başarı Mesaj Alanı -->
                        <div id="mesajKutusu" class="alert text-center" style="display: none;"></div>

                        <!-- 1. GİRİŞ YAP FORMU -->
                        <form id="loginForm">
                            <div class="form-floating mb-3">
                                <input class="form-control" id="loginUsername" type="text" placeholder="Kullanıcı Adı" required />
                                <label for="loginUsername">Kullanıcı Adı</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input class="form-control" id="loginPassword" type="password" placeholder="Şifre" required />
                                <label for="loginPassword">Şifre</label>
                            </div>

                            <!-- Yan yana iki şık buton -->
                            <div class="d-flex justify-content-between mt-4 mb-0">
                                <button type="button" class="btn btn-outline-secondary px-4" id="btnKayitEkraninaGec">Kayıt Ol</button>
                                <button type="submit" class="btn btn-primary px-4" id="btnLogin">Giriş Yap</button>
                            </div>
                        </form>

                        <!-- 2. KAYIT OL FORMU (Başlangıçta Gizli) -->
                        <form id="registerForm" style="display: none;">
                            <div class="form-floating mb-3">
                                <input class="form-control" id="regUsername" type="text" placeholder="Kullanıcı Adı" required />
                                <label for="regUsername">Kullanıcı Adı</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="regEmail" type="email" placeholder="E-Posta" required />
                                <label for="regEmail">E-Posta Adresi</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input class="form-control" id="regPassword" type="password" placeholder="Şifre" required />
                                <label for="regPassword">Şifre</label>
                            </div>

                            <!-- Yan yana iki şık buton -->
                            <div class="d-flex justify-content-between mt-4 mb-0">
                                <button type="button" class="btn btn-outline-secondary px-4" id="btnGirisEkraninaDon">Geri Dön</button>
                                <button type="submit" class="btn btn-success px-4" id="btnRegister">Hesap Oluştur</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Form ve Buton Elementlerini Yakalayalım
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formBaslik = document.getElementById('formBaslik');
        const mesajKutusu = document.getElementById('mesajKutusu');

        // Formlar Arası Geçiş Animasyonları
        document.getElementById('btnKayitEkraninaGec').addEventListener('click', () => {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            formBaslik.textContent = 'Yeni Hesap Oluştur';
            mesajKutusu.style.display = 'none';
        });

        document.getElementById('btnGirisEkraninaDon').addEventListener('click', () => {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            formBaslik.textContent = 'Portföy Yönetim Sistemi';
            mesajKutusu.style.display = 'none';
        });

        // MESAJ GÖSTERME FONKSİYONU
        function mesajGoster(tip, metin) {
            mesajKutusu.className = `alert alert-${tip} text-center`;
            mesajKutusu.textContent = metin;
            mesajKutusu.style.display = 'block';
        }

        // --- GİRİŞ YAPMA İŞLEMİ ---
        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.textContent = 'Bekleyin...';
            mesajKutusu.style.display = 'none';

            try {
                const response = await fetch('/api/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kullaniciAdi: document.getElementById('loginUsername').value.trim(),
                        sifre: document.getElementById('loginPassword').value.trim()
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const token = data.accessToken || data.AccessToken;
                    if (token) {
                        localStorage.setItem('token', token);
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    mesajGoster('danger', 'Kullanıcı adı veya şifre hatalı.');
                }
            } catch (error) {
                mesajGoster('danger', 'Sunucuya bağlanılamadı.');
            }
            btn.disabled = false;
            btn.textContent = 'Giriş Yap';
        });

        // --- KAYIT OLMA İŞLEMİ ---
        registerForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('btnRegister');
            btn.disabled = true;
            btn.textContent = 'Oluşturuluyor...';
            mesajKutusu.style.display = 'none';

            try {
                const response = await fetch('/api/Auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kullaniciAdi: document.getElementById('regUsername').value.trim(),
                        email: document.getElementById('regEmail').value.trim(),
                        sifre: document.getElementById('regPassword').value.trim()
                    })
                });

                if (response.ok) {
                    mesajGoster('success', 'Hesap başarıyla oluşturuldu! Şimdi giriş yapabilirsiniz.');
                    setTimeout(() => {
                        document.getElementById('btnGirisEkraninaDon').click();
                    }, 2000);
                } else {
                    const errorData = await response.text();
                    mesajGoster('danger', 'Kayıt başarısız: ' + errorData);
                }
            } catch (error) {
                mesajGoster('danger', 'Sunucuya bağlanılamadı.');
            }
            btn.disabled = false;
            btn.textContent = 'Hesap Oluştur';
        });
    </script>
</body>
</html>
